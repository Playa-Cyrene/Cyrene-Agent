name: 安装/构建问题 🔧
description: pnpm install / pnpm run build 等环境与构建失败
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        > [!IMPORTANT]
        > 本项目欢迎合理使用 AI 辅助，但提交者需要对最终内容负责。
        > 请勿直接粘贴未经人工审阅、整理和验证的 AI 原始输出。
        > 若内容明显是未整理的 AI 输出，维护者可能要求重新整理后再继续处理。

        **未按本模板提交的 Issue 会被机器人自动关闭**，请认真填写下面的每一项。

  - type: checkboxes
    attributes:
      label: AI 辅助声明（提交前请逐条确认）
      options:
        - label: 我已确认：本 Issue 由我本人阅读、核对并整理，未直接粘贴未经处理的 AI 原始输出
          required: true
        - label: 我已核对其中涉及的技术事实，并对最终内容负责
          required: true
        - label: 我已区分「已确认事实」和「AI 推测 / 尚待验证的结论」
          required: true
        - label: 如果 AI 给出了根因分析，我已把「已确认事实」和「根因推测」分开陈述
          required: true

  - type: markdown
    attributes:
      value: |
        ## ⚠️ 请先确认环境
        从源码构建需要 **Node.js 24 LTS** 和 **pnpm 10.33.0**（`pnpm install` / `pnpm run build`）。
        Electron runtime 当前为 **Electron 43**（暂不升级）。

        > 如果是应用运行中的功能异常（不是安装/构建），请返回选择「运行时 Bug（安装包）🐛」或「运行时 Bug（源码）🐛」。

  - type: dropdown
    id: os
    attributes:
      label: 操作系统
      options:
        - Windows 11
        - Windows 10
        - macOS (unsupported)
        - Linux (unsupported)
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Node.js 版本
      description: 运行 `node --version` 的输出
      placeholder: "v24.x.x"
    validations:
      required: true

  - type: input
    id: npm-version
    attributes:
      label: npm 版本
      description: 运行 `npm --version` 的输出
      placeholder: "11.x.x"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 你执行了哪些命令？按顺序列出
      placeholder: |
        1. git clone https://github.com/Playa-Cyrene/Cyrene-Agent.git
        2. cd Cyrene-Agent
        3. pnpm install
        4. ...
    validations:
      required: true

  - type: textarea
    id: error
    attributes:
      label: 错误日志
      description: |
        完整错误信息。请用 `pnpm install 2>&1 | tee log.txt` 保存日志，
        然后粘贴 `log.txt` 最后 ~50 行。
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      description: 你期望发生什么？实际发生了什么？
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: 截图
      description: 如果有报错截图，请拖拽上传
    validations:
      required: false
