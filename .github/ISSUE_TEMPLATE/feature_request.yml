name: 功能请求 ✨
description: 提议一个新功能或改进
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        ## 🌸 感谢你的提议！
        请先搜索已有 Issue，避免重复提交。
        涉及核心架构、权限边界或行为调整的大功能，建议先写清动机和使用场景。
        > 如果你判断现有代码应该如何修改，请以仓库源码为依据，提供源码路径、行号或调用链。
        > 压缩或编译后的安装包代码可以说明可观察现象，但不能单独证明业务逻辑或实现意图。尚未定位源码时，请把具体改法标为推测；描述使用场景和期望效果无需先分析源码。

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 你遇到了什么不便？什么场景下需要这个功能？
      placeholder: 在使用 XX 功能时，我想要……但是……
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的方案
      description: 你希望它怎么工作？交互上长什么样？
    validations:
      required: true

  - type: textarea
    id: source-evidence
    attributes:
      label: 源码依据（涉及现有实现分析或具体改法时填写）
      description: |
        如果你认为某段现有代码导致了问题，或提出了具体实现方案，请提供对应源码的相对路径、行号和相关调用链。
        普通功能建议无需先定位代码；尚未定位源码时可填写「尚未定位」，并将实现判断标为推测。
      placeholder: |
        提交号（commit）：
        文件与行号：src/main/...:123
        调用链或判断依据：
        （尚未定位时填写“尚未定位”）
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 有没有想过其他做法？为什么觉得现在的方案更好？
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: 相关区域
      multiple: true
      options:
        - 对话 / Agent
        - 工具 / 技能 / 插件
        - 界面 / 交互
        - 渠道接入（QQ、微信等）
        - 语音（TTS / ASR / 通话）
        - Live2D / 外观
        - 其他
    validations:
      required: true
