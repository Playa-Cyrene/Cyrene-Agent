name: 架构讨论 🧠
description: 核心模块、依赖边界、API 设计方向——发起深度讨论
labels: ["rfc"]
body:
  - type: markdown
    attributes:
      value: |
        > [!IMPORTANT]
        > 本项目欢迎合理使用 AI 辅助，但提交者需要对最终内容负责。
        > 请勿直接粘贴未经人工审阅、整理和验证的 AI 原始输出。
        > 若内容明显是未整理的 AI 输出，维护者可能要求重新整理后再继续处理。

        **未按本模板提交的 Issue 会被机器人自动关闭**，请认真填写下面的每一项。

  - type: checkboxes
    attributes:
      label: AI 辅助声明（提交前请逐条确认）
      options:
        - label: 我已确认：本 Issue 由我本人阅读、核对并整理，未直接粘贴未经处理的 AI 原始输出
          required: true
        - label: 我已核对其中涉及的技术事实，并对最终内容负责
          required: true
        - label: 我已区分「已确认事实」和「AI 推测 / 尚待验证的结论」
          required: true
        - label: 如果 AI 给出了根因分析，我已把「已确认事实」和「根因推测」分开陈述
          required: true

  - type: markdown
    attributes:
      value: |
        ## 🧠 这是技术深度讨论，不是功能请求
        请描述：核心模块现状、提议的设计、影响范围与替代方案。
        如果只是想加用户能感知的功能/UI 改动，请返回「功能请求 ✨」。

  - type: dropdown
    id: area
    attributes:
      label: 涉及哪个核心模块
      multiple: true
      options:
        - Agent / 对话引擎
        - 工具 / 技能
        - 插件系统
        - 渠道接入
        - 事件总线
        - 提示词 / 上下文
        - 渲染层 / UI
        - 持久化 / 配置
        - 构建 / 打包
        - 其他
    validations:
      required: true

  - type: input
    id: context
    attributes:
      label: 涉及的文件 / 模块路径
      description: 比如 src/main/plugin/loader.ts、CyreneHarness、tool-shared
    validations:
      required: false

  - type: textarea
    id: problem
    attributes:
      label: 当前痛点 / 风险
      description: 现状有什么问题？为什么需要改？不动会怎样？
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 提议的设计方案
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
    validations:
      required: false

  - type: textarea
    id: impact
    attributes:
      label: 影响范围 / 风险
      description: 谁会受影响？插件？渠道？数据迁移？回滚成本？
    validations:
      required: false
