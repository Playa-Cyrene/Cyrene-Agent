name: 运行时 Bug（源码）🐛
description: 从仓库源码运行（git clone + pnpm run dev）时出现的功能异常、偶现问题、崩溃等
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        ## ⚠️ 我们无法重现的问题是无法修复的
        请尽量写清触发条件和复现步骤；偶现问题请注明出现频率（如「上千次出一次」）。

        > 如果是 pnpm install / 构建失败，请返回选择「安装/构建问题 🔧」。
        > 本模板适用于从仓库源码运行（git clone + pnpm install / pnpm run dev）；如果你用的是 GitHub Releases 下载的安装包，请返回选择「运行时 Bug（安装包）🐛」。
        > 请务必填写当前提交号：`package.json` 里的版本号只代表打包时的版本，无法区分不同的代码状态，只有提交号能定位到你实际运行的代码。

  - type: input
    id: commit
    attributes:
      label: 提交号（commit）
      description: 在仓库目录运行 `git rev-parse --short HEAD` 的输出
      placeholder: "如 a1b2c3d"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: 操作系统
      options:
        - Windows 11
        - Windows 10
    validations:
      required: true

  - type: dropdown
    id: mode
    attributes:
      label: 出问题的会话模式
      multiple: true
      options:
        - chat（聊天）
        - work（工作）
        - learn（学习）
        - code（编程）
        - 不确定 / 其他入口（渠道、定时任务等）
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 按顺序描述你做了什么。偶现问题写触发场景即可。
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 实际发生了什么？有没有报错提示？
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      description: 你认为应该发生什么？
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: 日志 / 截图
      description: |
        如有报错弹窗、异常截图请拖拽上传。
        日志位于 `%APPDATA%/Cyrene/logs/`，可粘贴相关片段。
    validations:
      required: false

  - type: textarea
    id: source-evidence
    attributes:
      label: 源码依据（涉及实现或根因判断时填写）
      description: |
        请对应到上面填写的提交号，提供仓库源码的相对路径、行号及相关调用链。
        还没定位到源码时可填写「尚未定位」。
      placeholder: |
        文件与行号：src/main/...:123
        调用链或判断依据：
        （尚未定位时填写“尚未定位”）
    validations:
      required: false

  - type: input
    id: frequency
    attributes:
      label: 出现频率
      description: 必现 / 偶现（大约多少次出一次）
      placeholder: "必现 / 偶现（约 N 次出 1 次）"
    validations:
      required: false