name: plugin-sdk

# 插件开发包的构建、校验与发布：
# - PR / master 推送只做构建、打包与示例编译测试
# - plugin-sdk-v* 标签通过 Trusted Publishing（OIDC + provenance）发布到 npm
on:
  push:
    branches: [master]
    tags: ["plugin-sdk-v*"]
  pull_request:
    branches: [master]

jobs:
  build-test:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci --foreground-scripts

      # 打包质量校验：Schema 无漂移、vendored 契约无漂移、包内容与内部路径检查、双入口加载
      - name: Build and verify SDK package
        run: npm run check:plugin-sdk

      # 端到端：从打包产物（而非源码）编译四个示例插件并冒烟测试
      - name: Compile and smoke-test plugin examples
        run: npm run test:plugin-examples

  publish:
    if: startsWith(github.ref, 'refs/tags/plugin-sdk-v')
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      # npm Trusted Publishing 需要 OIDC id-token；contents 只读
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci --foreground-scripts

      - name: Build SDK
        run: npm run build:plugin-sdk

      - name: Verify OIDC publishing prerequisites
        run: |
          test -n "$ACTIONS_ID_TOKEN_REQUEST_URL"
          test -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN"
          npm config get registry

      # npm Trusted Publishing 通过 GitHub OIDC 交换短期发布凭据。
      # 不配置 registry-url / NODE_AUTH_TOKEN，避免 setup-node 生成空的
      # _authToken 并使 npm 错走传统令牌鉴权。
      - name: Publish to npm
        run: npm publish ./packages/plugin-sdk --access public --loglevel verbose
