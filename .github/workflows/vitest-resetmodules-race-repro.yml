name: Vitest resetModules repetition threshold

on:
  push:
    branches:
      - tmp/vitest-resetmodules-race-repro

jobs:
  repro:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        repeats: [2, 4, 8, 16, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Make run deterministic
        shell: bash
        run: |
          node - <<'EOF'
          const fs = require("fs")
          const p = "vitest.config.ts"
          let s = fs.readFileSync(p, "utf8")
          s = s.replace("maxWorkers: 4,", "maxWorkers: 1,")
          s = s.replace("fileParallelism: true,", "fileParallelism: false,")
          fs.writeFileSync(p, s)
          EOF

      - name: Create repeated companion
        env:
          REPEATS: ${{ matrix.repeats }}
        shell: bash
        run: |
          cat > src/main/memory/vitest-race-companion.test.ts <<'EOF'
          import * as fs from "fs"
          import * as os from "os"
          import * as path from "path"
          import { beforeEach, expect, it, vi } from "vitest"

          const electronMock = vi.hoisted(() => ({ userDataDir: "" }))
          const exporterMock = vi.hoisted(() => ({ notifyMemoryChanged: vi.fn() }))

          vi.mock("electron", () => ({
            app: { getPath: () => electronMock.userDataDir },
          }))

          vi.mock("./obsidian-exporter", () => ({
            notifyMemoryChanged: exporterMock.notifyMemoryChanged,
          }))

          beforeEach(() => {
            electronMock.userDataDir = fs.mkdtempSync(path.join(os.tmpdir(), "race-repeat-"))
            vi.resetModules()
            exporterMock.notifyMemoryChanged.mockReset()
          })

          const repeats = Number(process.env.REPEATS)

          for (let i = 0; i < repeats; i++) {
            it(`write cycle ${i}`, async () => {
              const { memoryStore } = await import("./memory-store")
              const memory = await memoryStore.addL2Memory({
                content: `companion-${i}`,
                triggerText: "companion",
                sourceConversationId: "test",
                isPinned: false,
              })
              expect(memory.id).toBeTruthy()
            })
          }
          EOF

      - name: Run manager with repeated companion
        env:
          REPEATS: ${{ matrix.repeats }}
        run: npx vitest run src/main/memory/memory-manager.test.ts src/main/memory/vitest-race-companion.test.ts
