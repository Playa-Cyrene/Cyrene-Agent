name: Vitest resetModules exact store-case scan

on:
  push:
    branches:
      - tmp/vitest-resetmodules-race-repro

jobs:
  repro:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Make run deterministic
        shell: bash
        run: |
          node - <<'EOF'
          const fs = require("fs")
          const p = "vitest.config.ts"
          let s = fs.readFileSync(p, "utf8")
          s = s.replace("maxWorkers: 4,", "maxWorkers: 1,")
          s = s.replace("fileParallelism: true,", "fileParallelism: false,")
          fs.writeFileSync(p, s)
          EOF

      - name: Prepare store case list
        shell: bash
        run: |
          cat > /tmp/store-titles.txt <<'EOF'
          persists L2 conflict markers and status changes
          keeps pinned L2 memories active when marking conflicts
          decays only unpinned active L2 memories with positive weight
          updates L0 and L2 through atomic write APIs
          does not downgrade an active memory when recording a recall
          creates evidence for new L2 memories with bounded snippets
          deletes evidence together with a rolled-back L2 memory
          marks L2 sync status and persists rag ids
          stores conflict logs separately from reflection logs with a capped history
          persists conflict scores and emits conflict.score trace
          queues resolver-eligible conflict logs when scoring priority is not none
          does not queue conflict logs with none resolver priority
          returns queued resolver logs by priority and age
          applies preference evolution by creating resolved memory and marking old entries
          marks direct conflicts as clarification needed without creating resolved memory
          caps reflection logs separately from conflict logs
          migrates legacy memory files with a backup
          saves the transformed store before notifying Obsidian
          EOF

      - name: Run every store case separately with manager
        shell: bash
        run: |
          set +e
          INDEX=0
          TRIGGERS=0
          while IFS= read -r TITLE; do
            echo ""
            echo "=== STORE CASE $INDEX === $TITLE"
            npx vitest run               src/main/memory/memory-manager.test.ts               src/main/memory/memory-store.test.ts               -t "MemoryManager L2 sync|$TITLE"
            STATUS=$?

            if [ "$STATUS" -ne 0 ]; then
              echo "TRIGGER_CASE[$INDEX]: $TITLE"
              TRIGGERS=$((TRIGGERS + 1))
            else
              echo "PASS_CASE[$INDEX]: $TITLE"
            fi
            INDEX=$((INDEX + 1))
          done < /tmp/store-titles.txt

          echo "TOTAL_TRIGGER_CASES=$TRIGGERS"
          exit 0
