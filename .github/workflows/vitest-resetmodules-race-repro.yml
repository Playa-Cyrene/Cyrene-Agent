name: Vitest pending dynamic-import overlap probe

on:
  push:
    branches:
      - tmp/vitest-resetmodules-race-repro

jobs:
  repro:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: one-write
            writes: 1
            settle: "false"
          - case: two-writes
            writes: 2
            settle: "false"
          - case: three-writes
            writes: 3
            settle: "false"
          - case: two-writes-settled
            writes: 2
            settle: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Make run deterministic
        shell: bash
        run: |
          node - <<'EOF'
          const fs = require("fs")
          const p = "vitest.config.ts"
          let s = fs.readFileSync(p, "utf8")
          s = s.replace("maxWorkers: 4,", "maxWorkers: 1,")
          s = s.replace("fileParallelism: true,", "fileParallelism: false,")
          fs.writeFileSync(p, s)
          EOF

      - name: Create overlap companion
        env:
          WRITES: ${{ matrix.writes }}
          SETTLE: ${{ matrix.settle }}
        shell: bash
        run: |
          cat > src/main/memory/vitest-race-companion.test.ts <<'EOF'
          import * as fs from "fs"
          import * as os from "os"
          import * as path from "path"
          import { expect, it, vi } from "vitest"

          const electronMock = vi.hoisted(() => ({
            userDataDir: fs.mkdtempSync(path.join(os.tmpdir(), "race-overlap-")),
          }))
          const exporterMock = vi.hoisted(() => ({
            notifyMemoryChanged: vi.fn(),
          }))

          vi.mock("electron", () => ({
            app: { getPath: () => electronMock.userDataDir },
          }))

          vi.mock("./obsidian-exporter", () => ({
            notifyMemoryChanged: exporterMock.notifyMemoryChanged,
          }))

          it("starts repeated store saves", async () => {
            vi.resetModules()
            const { memoryStore } = await import("./memory-store")
            const writes = Number(process.env.WRITES)

            for (let i = 0; i < writes; i++) {
              await memoryStore.addL2Memory({
                content: `companion-${i}`,
                triggerText: "companion",
                sourceConversationId: "test",
                isPinned: false,
              })
            }

            if (process.env.SETTLE === "true") {
              await vi.dynamicImportSettled()
            }

            expect((await memoryStore.getAllL2()).length).toBe(writes)
          })
          EOF

      - name: Run manager with overlap companion
        env:
          WRITES: ${{ matrix.writes }}
          SETTLE: ${{ matrix.settle }}
        run: npx vitest run src/main/memory/memory-manager.test.ts src/main/memory/vitest-race-companion.test.ts
