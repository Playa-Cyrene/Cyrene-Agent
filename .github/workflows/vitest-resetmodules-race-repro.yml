name: Vitest resetModules minimal race repro

on:
  push:
    branches:
      - tmp/vitest-resetmodules-race-repro

jobs:
  repro:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        vitest: ["4.1.11", "5.0.1"]
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Create standalone repro
        shell: bash
        run: |
          set -euo pipefail
          mkdir repro
          cd repro
          npm init -y >/dev/null
          npm pkg set type=module >/dev/null
          npm install --no-save vitest@${{ matrix.vitest }}

          cat > store.js <<'EOF'
          export const store = {
            add() {
              return "ok"
            },
            save() {
              void import("./exporter.js")
            },
          }
          EOF

          cat > manager.js <<'EOF'
          import { store } from "./store.js"

          export function write() {
            store.save()
            return store.add()
          }
          EOF

          cat > exporter.js <<'EOF'
          import { store } from "./store.js"

          await new Promise((resolve) => setTimeout(resolve, 20))

          export const observedStore = store
          EOF

          cat > repro.test.js <<'EOF'
          import { beforeEach, expect, test, vi } from "vitest"

          beforeEach(() => {
            vi.resetModules()
          })

          for (let i = 0; i < 100; i++) {
            test(`iteration ${i}`, async () => {
              const { write } = await import("./manager.js")
              const { store } = await import("./store.js")

              expect(store).toBeDefined()
              expect(store.add()).toBe("ok")
              expect(write()).toBe("ok")
            })
          }
          EOF

          cat > vitest.config.js <<'EOF'
          import { defineConfig } from "vitest/config"

          export default defineConfig({
            test: {
              environment: "node",
              pool: "forks",
              maxWorkers: 1,
              fileParallelism: false,
              watch: false,
              cache: false,
            },
          })
          EOF

      - name: Run standalone repro repeatedly
        shell: bash
        run: |
          set -euo pipefail
          cd repro
          for i in $(seq 1 10); do
            echo "=== standalone iteration $i / Vitest ${{ matrix.vitest }} ==="
            npx vitest run
          done
