name: Vitest resetModules mechanism isolate

on:
  push:
    branches:
      - tmp/vitest-resetmodules-race-repro

jobs:
  repro:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        case: [mock-only, mock-import-store, mock-write-store, real-write-store]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Make run deterministic
        shell: bash
        run: |
          node - <<'EOF'
          const fs = require("fs")
          const p = "vitest.config.ts"
          let s = fs.readFileSync(p, "utf8")
          s = s.replace("maxWorkers: 4,", "maxWorkers: 1,")
          s = s.replace("fileParallelism: true,", "fileParallelism: false,")
          fs.writeFileSync(p, s)
          EOF

      - name: Create minimal companion
        env:
          CASE: ${{ matrix.case }}
        shell: bash
        run: |
          set -euo pipefail
          P=src/main/memory/vitest-race-companion.test.ts

          if [ "$CASE" = "mock-only" ]; then
            cat > "$P" <<'EOF'
          import { expect, it, vi } from "vitest"

          vi.mock("./obsidian-exporter", () => ({
            notifyMemoryChanged: vi.fn(),
          }))

          it("registers exporter mock only", () => {
            expect(true).toBe(true)
          })
          EOF
          elif [ "$CASE" = "mock-import-store" ]; then
            cat > "$P" <<'EOF'
          import * as fs from "fs"
          import * as os from "os"
          import * as path from "path"
          import { beforeEach, expect, it, vi } from "vitest"

          const electronMock = vi.hoisted(() => ({ userDataDir: "" }))

          vi.mock("electron", () => ({
            app: { getPath: () => electronMock.userDataDir },
          }))

          vi.mock("./obsidian-exporter", () => ({
            notifyMemoryChanged: vi.fn(),
          }))

          beforeEach(() => {
            electronMock.userDataDir = fs.mkdtempSync(path.join(os.tmpdir(), "race-companion-"))
            vi.resetModules()
          })

          it("imports store with exporter mocked", async () => {
            const { memoryStore } = await import("./memory-store")
            expect(memoryStore).toBeDefined()
          })
          EOF
          elif [ "$CASE" = "mock-write-store" ]; then
            cat > "$P" <<'EOF'
          import * as fs from "fs"
          import * as os from "os"
          import * as path from "path"
          import { beforeEach, expect, it, vi } from "vitest"

          const electronMock = vi.hoisted(() => ({ userDataDir: "" }))

          vi.mock("electron", () => ({
            app: { getPath: () => electronMock.userDataDir },
          }))

          vi.mock("./obsidian-exporter", () => ({
            notifyMemoryChanged: vi.fn(),
          }))

          beforeEach(() => {
            electronMock.userDataDir = fs.mkdtempSync(path.join(os.tmpdir(), "race-companion-"))
            vi.resetModules()
          })

          it("writes store with exporter mocked", async () => {
            const { memoryStore } = await import("./memory-store")
            const memory = await memoryStore.addL2Memory({
              content: "companion",
              triggerText: "companion",
              sourceConversationId: "test",
              isPinned: false,
            })
            expect(memory.id).toBeTruthy()
          })
          EOF
          else
            cat > "$P" <<'EOF'
          import * as fs from "fs"
          import * as os from "os"
          import * as path from "path"
          import { beforeEach, expect, it, vi } from "vitest"

          const electronMock = vi.hoisted(() => ({ userDataDir: "" }))

          vi.mock("electron", () => ({
            app: { getPath: () => electronMock.userDataDir },
          }))

          beforeEach(() => {
            electronMock.userDataDir = fs.mkdtempSync(path.join(os.tmpdir(), "race-companion-"))
            vi.resetModules()
          })

          it("writes store with real exporter", async () => {
            const { memoryStore } = await import("./memory-store")
            const memory = await memoryStore.addL2Memory({
              content: "companion",
              triggerText: "companion",
              sourceConversationId: "test",
              isPinned: false,
            })
            expect(memory.id).toBeTruthy()
          })
          EOF
          fi

      - name: Run manager with minimal companion
        run: npx vitest run src/main/memory/memory-manager.test.ts src/main/memory/vitest-race-companion.test.ts
