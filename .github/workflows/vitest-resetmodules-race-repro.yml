name: Standalone Vitest exporter-prime repro

on:
  push:
    branches:
      - tmp/vitest-resetmodules-race-repro

jobs:
  repro:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        vitest: ["4.1.11", "5.0.1"]
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Create minimal project
        shell: bash
        run: |
          set -euo pipefail
          mkdir repro
          cd repro
          npm init -y >/dev/null
          npm pkg set type=module >/dev/null
          npm install --no-save vitest@${{ matrix.vitest }}

          cat > store.js <<'EOF'
          export const store = {
            add() {
              this.save()
              return "ok"
            },
            save() {
              void import("./exporter.js")
            },
          }
          EOF

          cat > exporter.js <<'EOF'
          import { store } from "./store.js"

          export function notify() {
            return store
          }
          EOF

          cat > manager.js <<'EOF'
          import { store } from "./store.js"

          export function write() {
            return store.add()
          }
          EOF

          cat > a-primer.test.js <<'EOF'
          import { expect, test, vi } from "vitest"

          test("prime exporter in an isolated file", async () => {
            vi.resetModules()
            const exporter = await import("./exporter.js")
            expect(exporter.notify()).toBeDefined()
          })

          /*
          PRIMER_PADDING
          */
          EOF

          python - <<'PY'
          p = "a-primer.test.js"
          with open(p, "a", encoding="utf-8") as f:
              f.write("/* " + ("primer-padding " * 10000) + " */\n")
          PY

          cat > z-manager.test.js <<'EOF'
          import { beforeEach, expect, test, vi } from "vitest"

          beforeEach(() => {
            vi.resetModules()
          })

          test("first evaluation", async () => {
            const { write } = await import("./manager.js")
            const { store } = await import("./store.js")
            expect(store).toBeDefined()
            expect(write()).toBe("ok")
          })

          test("second evaluation after resetModules", async () => {
            const { write } = await import("./manager.js")
            const { store } = await import("./store.js")
            expect(store).toBeDefined()
            expect(write()).toBe("ok")
          })
          EOF

          cat > vitest.config.js <<'EOF'
          import { defineConfig } from "vitest/config"

          export default defineConfig({
            test: {
              environment: "node",
              pool: "forks",
              maxWorkers: 1,
              minWorkers: 1,
              fileParallelism: false,
              watch: false,
              cache: false,
            },
          })
          EOF

      - name: Run standalone repro
        run: cd repro && npx vitest run
