name: Vitest resetModules companion-file bisect B

on:
  push:
    branches:
      - tmp/vitest-resetmodules-race-repro

jobs:
  repro:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: B1
            files: >-
              src/main/memory/memory-resolver.test.ts
              src/main/memory/memory-scheduler.test.ts
          - group: B2
            files: >-
              src/main/memory/memory-schemas.test.ts
              src/main/memory/memory-store-dmae.test.ts
          - group: B3
            files: >-
              src/main/memory/memory-store-io.test.ts
              src/main/memory/memory-store-migrations.test.ts
          - group: B4
            files: >-
              src/main/memory/memory-store.test.ts
              src/main/memory/obsidian-exporter.test.ts
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Make run deterministic
        shell: bash
        run: |
          node - <<'EOF'
          const fs = require("fs")
          const p = "vitest.config.ts"
          let s = fs.readFileSync(p, "utf8")
          s = s.replace("maxWorkers: 4,", "maxWorkers: 1,")
          s = s.replace("fileParallelism: true,", "fileParallelism: false,")
          fs.writeFileSync(p, s)
          EOF

      - name: Run target with companion group ${{ matrix.group }}
        env:
          FILES: ${{ matrix.files }}
        shell: bash
        run: npx vitest run src/main/memory/memory-manager.test.ts $FILES
