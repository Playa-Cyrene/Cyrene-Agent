name: Vitest resetModules exact store-case scan

on:
  push:
    branches:
      - tmp/vitest-resetmodules-race-repro

jobs:
  repro:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Make run deterministic
        shell: bash
        run: |
          node - <<'EOF'
          const fs = require("fs")
          const p = "vitest.config.ts"
          let s = fs.readFileSync(p, "utf8")
          s = s.replace("maxWorkers: 4,", "maxWorkers: 1,")
          s = s.replace("fileParallelism: true,", "fileParallelism: false,")
          fs.writeFileSync(p, s)
          EOF

      - name: Prepare exact case scan
        shell: bash
        run: |
          cp src/main/memory/memory-store.test.ts /tmp/memory-store.test.ts
          node - <<'EOF'
          const fs = require("fs")
          const s = fs.readFileSync("/tmp/memory-store.test.ts", "utf8")
          const titles = [...s.matchAll(/\\bit\\("([^"]+)"/g)].map((m) => m[1])
          fs.writeFileSync("/tmp/store-titles.json", JSON.stringify(titles))
          console.log("store test cases:", titles.length)
          titles.forEach((title, i) => console.log(i, title))
          EOF

      - name: Run every store case separately with manager
        shell: bash
        run: |
          set -uo pipefail
          COUNT=$(node -e 'console.log(require("/tmp/store-titles.json").length)')
          TRIGGERS=0

          for ((i=0; i<COUNT; i++)); do
            I="$i" node - <<'EOF'
          const fs = require("fs")
          const i = Number(process.env.I)
          const src = fs.readFileSync("/tmp/memory-store.test.ts", "utf8")
          const titles = JSON.parse(fs.readFileSync("/tmp/store-titles.json", "utf8"))
          const title = titles[i]
          let out = src.replace(/\\bit\\("/g, 'it.skip("')
          out = out.replace(`it.skip("${title}"`, `it("${title}"`)
          fs.writeFileSync("src/main/memory/memory-store.test.ts", out)
          console.log("\\n=== STORE CASE", i, "===", title)
          EOF

            npx vitest run src/main/memory/memory-manager.test.ts src/main/memory/memory-store.test.ts
            STATUS=$?

            TITLE=$(I="$i" node -e 'const t=require("/tmp/store-titles.json"); console.log(t[Number(process.env.I)])')
            if [ "$STATUS" -ne 0 ]; then
              echo "TRIGGER_CASE[$i]: $TITLE"
              TRIGGERS=$((TRIGGERS + 1))
            else
              echo "PASS_CASE[$i]: $TITLE"
            fi
          done

          echo "TOTAL_TRIGGER_CASES=$TRIGGERS"
          exit 0
