name: Vitest resetModules worker isolation probe

on:
  push:
    branches:
      - tmp/vitest-resetmodules-race-repro

jobs:
  repro:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workers: [1, 4]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Force Vitest 5.0.1
        run: npm install --no-save --package-lock=false vitest@5.0.1

      - name: Configure worker count
        env:
          WORKERS: ${{ matrix.workers }}
        shell: bash
        run: |
          node - <<'EOF'
          const fs = require("fs")
          const p = "vitest.config.ts"
          const workers = Number(process.env.WORKERS)
          let s = fs.readFileSync(p, "utf8")
          s = s.replace("maxWorkers: 4,", `maxWorkers: ${workers},`)
          s = s.replace("fileParallelism: true,", `fileParallelism: ${workers === 1 ? "false" : "true"},`)
          fs.writeFileSync(p, s)
          EOF

      - name: Run real memory + rag shard
        run: npx vitest run src/main/memory src/main/rag
