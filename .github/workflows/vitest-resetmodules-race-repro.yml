name: Vitest exporter dependency bisect

on:
  push:
    branches:
      - tmp/vitest-resetmodules-race-repro

jobs:
  repro:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        deps: [base, fs-path, sync-flag, logger, vault-config, entity-graph, all-imports]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Make run deterministic
        shell: bash
        run: |
          node - <<'EOF'
          const fs = require("fs")
          const p = "vitest.config.ts"
          let s = fs.readFileSync(p, "utf8")
          s = s.replace("maxWorkers: 4,", "maxWorkers: 1,")
          s = s.replace("fileParallelism: true,", "fileParallelism: false,")
          fs.writeFileSync(p, s)
          EOF

      - name: Build minimized exporter dependency set
        env:
          DEPS: ${{ matrix.deps }}
        shell: bash
        run: |
          P=src/main/memory/obsidian-exporter.ts
          cat > "$P" <<'EOF'
          import { memoryStore } from "./memory-store"
          EOF

          case "$DEPS" in
            fs-path)
              cat >> "$P" <<'EOF'
          import * as fs from "fs"
          import * as path from "path"
          void fs
          void path
          EOF
              ;;
            sync-flag)
              cat >> "$P" <<'EOF'
          import { isImportingMemory } from "./obsidian-sync-flag"
          void isImportingMemory
          EOF
              ;;
            logger)
              cat >> "$P" <<'EOF'
          import { logger, LogTag } from "../logger"
          void logger
          void LogTag
          EOF
              ;;
            vault-config)
              cat >> "$P" <<'EOF'
          import { loadObsidianVaultConfig, saveObsidianVaultConfig, isVaultBound } from "./obsidian-vault-config"
          void loadObsidianVaultConfig
          void saveObsidianVaultConfig
          void isVaultBound
          EOF
              ;;
            entity-graph)
              cat >> "$P" <<'EOF'
          import { entityGraph } from "./entity-graph"
          void entityGraph
          EOF
              ;;
            all-imports)
              cat >> "$P" <<'EOF'
          import * as fs from "fs"
          import * as path from "path"
          import { entityGraph } from "./entity-graph"
          import { logger, LogTag } from "../logger"
          import { loadObsidianVaultConfig, saveObsidianVaultConfig, isVaultBound } from "./obsidian-vault-config"
          import { isImportingMemory } from "./obsidian-sync-flag"
          void fs
          void path
          void entityGraph
          void logger
          void LogTag
          void loadObsidianVaultConfig
          void saveObsidianVaultConfig
          void isVaultBound
          void isImportingMemory
          EOF
              ;;
          esac

          cat >> "$P" <<'EOF'

          export function notifyMemoryChanged(): unknown {
            return memoryStore
          }
          EOF

      - name: Create exporter primer
        shell: bash
        run: |
          cat > src/main/memory/vitest-race-companion.test.ts <<'EOF'
          import * as fs from "fs"
          import * as os from "os"
          import * as path from "path"
          import { expect, it, vi } from "vitest"

          const electronMock = vi.hoisted(() => ({ userDataDir: "" }))

          vi.mock("electron", () => ({
            app: {
              getPath: () => electronMock.userDataDir,
              isPackaged: false,
            },
          }))

          it("primes obsidian-exporter in an isolated test file", async () => {
            electronMock.userDataDir = fs.mkdtempSync(path.join(os.tmpdir(), "race-prime-"))
            vi.resetModules()
            const exporter = await import("./obsidian-exporter")
            expect(exporter.notifyMemoryChanged).toBeTypeOf("function")
          })
          EOF

          python - <<'PY'
          p = "src/main/memory/vitest-race-companion.test.ts"
          with open(p, "a", encoding="utf-8") as f:
              f.write("\n/* " + ("primer-padding " * 10000) + " */\n")
          PY

      - name: Run two-file repro
        run: npx vitest run src/main/memory/memory-manager.test.ts src/main/memory/vitest-race-companion.test.ts
