name: Vitest exporter size-vs-shape probe

on:
  push:
    branches:
      - tmp/vitest-resetmodules-race-repro

jobs:
  repro:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lines: [0, 100, 300, 600]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Make run deterministic
        shell: bash
        run: |
          node - <<'EOF'
          const fs = require("fs")
          const p = "vitest.config.ts"
          let s = fs.readFileSync(p, "utf8")
          s = s.replace("maxWorkers: 4,", "maxWorkers: 1,")
          s = s.replace("fileParallelism: true,", "fileParallelism: false,")
          fs.writeFileSync(p, s)
          EOF

      - name: Build large dummy exporter
        env:
          LINES: ${{ matrix.lines }}
        shell: bash
        run: |
          cp src/main/memory/obsidian-exporter.ts /tmp/original-exporter.ts
          head -n 427 /tmp/original-exporter.ts > src/main/memory/obsidian-exporter.ts

          cat >> src/main/memory/obsidian-exporter.ts <<'EOF'
          export async function exportMemoryToObsidianVault(_outputDir: string): Promise<ExportResult> {
            let n = 0
          EOF

          for i in $(seq 1 "$LINES"); do
            echo "  n += $i" >> src/main/memory/obsidian-exporter.ts
          done

          cat >> src/main/memory/obsidian-exporter.ts <<'EOF'
            void n
            void memoryStore
            return { ok: true }
          }

          export function notifyMemoryChanged(): unknown {
            return memoryStore
          }
          EOF

      - name: Create exporter primer
        shell: bash
        run: |
          cat > src/main/memory/vitest-race-companion.test.ts <<'EOF'
          import * as fs from "fs"
          import * as os from "os"
          import * as path from "path"
          import { expect, it, vi } from "vitest"

          const electronMock = vi.hoisted(() => ({ userDataDir: "" }))
          vi.mock("electron", () => ({
            app: {
              getPath: () => electronMock.userDataDir,
              isPackaged: false,
            },
          }))

          it("primes obsidian-exporter", async () => {
            electronMock.userDataDir = fs.mkdtempSync(path.join(os.tmpdir(), "race-prime-"))
            vi.resetModules()
            const exporter = await import("./obsidian-exporter")
            expect(exporter.notifyMemoryChanged).toBeTypeOf("function")
          })
          EOF

          python - <<'PY'
          p = "src/main/memory/vitest-race-companion.test.ts"
          with open(p, "a", encoding="utf-8") as f:
              f.write("\n/* " + ("primer-padding " * 10000) + " */\n")
          PY

      - name: Run two-file repro
        run: npx vitest run src/main/memory/memory-manager.test.ts src/main/memory/vitest-race-companion.test.ts
