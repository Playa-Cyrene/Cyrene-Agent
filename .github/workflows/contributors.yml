name: contributors

# 贡献者头像列表自动维护：
# contrib.rocks 图片服务受其自身缓存与 GitHub camo 图片代理双重缓存影响，
# 新贡献者可能数周不更新，改为把头像表格直接写进 README，提交即最新。
# 标记对 <!-- readme: contributors -start/end --> 之间的内容由本工作流接管。
on:
  push:
    branches: [master]
  schedule:
    # 每周一 06:00 UTC 兜底刷新，覆盖不经 PR 直接落 master 的提交
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  update-contributors:
    runs-on: ubuntu-latest
    permissions:
      # 需要写权限把更新后的 README 提交回仓库
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Update contributors section in README
        uses: akhilmhdh/contributors-readme-action@v2.3.11
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # 头像 48px、单行 10 列，与既有排版一致
          image_size: 48
          columns_per_row: 10
          commit_message: "chore: 更新 README 贡献者头像列表"
          # master 若启用分支保护则改为开 PR，未启用则直接提交
          auto_detect_branch_protection: true
