<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cyrene</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    }

    .splash {
      width: 100%; height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
    }

    .splash__logo {
      width: 160px;
      height: 160px;
      object-fit: contain;
    }

    .loader {
      position: relative;
      display: flex;
      gap: 0.3em;
    }

    .loader::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 2em;
      filter: blur(45px);
      background-color: #e299ff;
      background-image: radial-gradient(at 52% 57%, hsla(11, 83%, 72%, 1) 0px, transparent 50%),
        radial-gradient(at 37% 57%, hsla(175, 78%, 66%, 1) 0px, transparent 50%);
    }

    .loader__circle {
      --size__loader: 0.6em;
      width: var(--size__loader);
      height: var(--size__loader);
      border-radius: 50%;
      animation: loader__jumping 2s infinite;
      background-color: #b499ff;
    }

    .loader__circle:nth-child(2n) {
      animation-delay: 300ms;
      background-color: #e499ff;
    }

    .loader__circle:nth-child(3n) {
      animation-delay: 600ms;
    }

    @keyframes loader__jumping {
      0%, 100% { transform: translateY(0px); }
      25% { transform: translateY(-15px) scale(0.5); }
      50% { transform: translateY(0px); }
      75% { transform: translateY(5px) scale(0.9); }
    }
  </style>
</head>
<body>
  <div class="splash">
    <img class="splash__logo" src="./loading.png" alt="Cyrene" />
    <div class="loader">
      <div class="loader__circle"></div>
      <div class="loader__circle"></div>
      <div class="loader__circle"></div>
      <div class="loader__circle"></div>
      <div class="loader__circle"></div>
    </div>
  </div>
</body>
</html>
